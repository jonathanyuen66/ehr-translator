server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Built assets (content-hashed by Vite) should 404 cleanly if requested
    # after their build has been replaced by a newer deploy — falling
    # through to the SPA catch-all below would instead silently return
    # index.html's HTML with a 200, which is worse: whatever expected
    # JavaScript gets HTML instead and fails in a confusing way.
    location /assets/ {
        try_files $uri =404;
    }

    # nginx's bundled mime.types predates the .mjs convention and has no
    # entry for it at all, so it fell back to the container's default_type
    # (application/octet-stream) — confirmed directly against the live site,
    # not just suspected. Browsers require a real JavaScript MIME type for
    # a dynamically-imported module, so pdf.js's worker (an .mjs file)
    # failed to load under that type with exactly "Failed to fetch
    # dynamically imported module".
    location ~* \.mjs$ {
        default_type text/javascript;
        try_files $uri =404;
    }

    # Single-page app: every other path falls back to index.html so a hard
    # reload/deep link doesn't 404 — the app itself does hash-based routing
    # (see accounts/views.py's #token=/#error= redirects), so no server-side
    # path matching is needed beyond this.
    location / {
        try_files $uri /index.html;
    }

    # Content-hashed filenames (Vite's default) are safe to cache forever;
    # index.html itself must never be served stale after a deploy, since it
    # references those hashed filenames.
    location = /index.html {
        add_header Cache-Control "no-cache, max-age=0";
    }
}
