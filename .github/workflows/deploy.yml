# Builds + deploys the Django API (Cloud Run) and the React frontend (GCS
# bucket behind the same load balancer) on every push to main.
#
# Auth is keyless: Workload Identity Federation exchanges GitHub's OIDC
# token for short-lived GCP credentials scoped to this exact repo — no
# service account JSON key is ever stored in GitHub. The WIF pool/provider
# and the ci-deployer-sa service account are created by infra/terraform
# (iam.tf), gated on the `github_repo` Terraform variable matching this repo.
#
# Required repository variables (Settings -> Secrets and variables -> Actions
# -> Variables), all sourced from `terraform output` after `terraform apply`:
#   GCP_PROJECT_ID              - var.project_id
#   GCP_REGION                  - var.region
#   WORKLOAD_IDENTITY_PROVIDER  - output.workload_identity_provider
#   FRONTEND_API_BASE_URL       - the LB's URL (https://<domain_name>, or
#                                  http://<lb_ip_address> before a domain
#                                  exists) — baked into the frontend build as
#                                  VITE_API_BASE_URL

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/ehr-translator/api:${{ github.sha }}

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation
    outputs:
      image: ${{ env.IMAGE }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ci-deployer-sa@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          docker build -t "$IMAGE" server/
          docker push "$IMAGE"

      # A separate one-off job, not a migration on every container boot —
      # avoids concurrent-migration races across instances (see run.tf).
      - name: Run database migrations
        run: |
          gcloud run jobs update migrate --region="${{ vars.GCP_REGION }}" --image="$IMAGE"
          gcloud run jobs execute migrate --region="${{ vars.GCP_REGION }}" --wait

      - name: Deploy API service
        run: |
          gcloud run services update api --region="${{ vars.GCP_REGION }}" --image="$IMAGE"

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-api
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        env:
          VITE_API_BASE_URL: ${{ vars.FRONTEND_API_BASE_URL }}
        run: |
          npm ci
          npm run build

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ci-deployer-sa@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Sync build to frontend bucket
        run: |
          gsutil -m rsync -r -d web/dist "gs://${{ vars.GCP_PROJECT_ID }}-ehr-frontend"

      - name: Invalidate CDN cache
        run: |
          gcloud compute url-maps invalidate-cdn-cache ehr-translator --path "/*" --async
