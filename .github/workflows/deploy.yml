# Builds + deploys the Django API and the React frontend, each its own
# Cloud Run service with its own public URL, on every push to main. No load
# balancer or CDN in front of either — both get custom-domain HTTPS via
# Cloud Run domain mapping instead (infra/terraform/dns.tf, run.tf), once
# root_domain is set.
#
# Auth is keyless: Workload Identity Federation exchanges GitHub's OIDC
# token for short-lived GCP credentials scoped to this exact repo — no
# service account JSON key is ever stored in GitHub. The WIF pool/provider
# and the ci-deployer-sa service account are created by infra/terraform
# (iam.tf), gated on the `github_repo` Terraform variable matching this repo.
#
# Required repository variables (Settings -> Secrets and variables -> Actions
# -> Variables), all sourced from `terraform output` after `terraform apply`:
#   GCP_PROJECT_ID              - var.project_id
#   GCP_REGION                  - var.region
#   WORKLOAD_IDENTITY_PROVIDER  - output.workload_identity_provider
#   FRONTEND_API_BASE_URL       - output.cloud_run_api_url (or, once the
#                                  custom domain's cert has provisioned,
#                                  output.api_custom_domain_url) — baked
#                                  into the frontend build as
#                                  VITE_API_BASE_URL

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/ehr-translator/api:${{ github.sha }}
  FRONTEND_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/ehr-translator/frontend:${{ github.sha }}

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation
    outputs:
      image: ${{ env.IMAGE }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ci-deployer-sa@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          docker build -t "$IMAGE" server/
          docker push "$IMAGE"

      # A separate one-off job, not a migration on every container boot —
      # avoids concurrent-migration races across instances (see run.tf).
      - name: Run database migrations
        run: |
          gcloud run jobs update migrate --region="${{ vars.GCP_REGION }}" --image="$IMAGE"
          gcloud run jobs execute migrate --region="${{ vars.GCP_REGION }}" --wait

      - name: Deploy API service
        run: |
          gcloud run services update api --region="${{ vars.GCP_REGION }}" --image="$IMAGE"

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-api
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ci-deployer-sa@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL="${{ vars.FRONTEND_API_BASE_URL }}" \
            -t "$FRONTEND_IMAGE" web/
          docker push "$FRONTEND_IMAGE"

      - name: Deploy frontend service
        run: |
          gcloud run services update frontend --region="${{ vars.GCP_REGION }}" --image="$FRONTEND_IMAGE"
